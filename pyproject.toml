[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rapid-dev"
version = "0.1.0"
description = "Local tools for building software with coding agents and GitHub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[project.urls]
Repository = "https://github.com/proxy-hatch/rapid-dev"
Issues = "https://github.com/proxy-hatch/rapid-dev/issues"

[project.scripts]
devctl = "agentic_engineering.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_engineering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
